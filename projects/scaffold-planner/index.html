<title>Scaffold Planner</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link
  rel="stylesheet"
  href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap"
/>
<style>
  /* Layout: site clipboard. Sticky job strip, editor column beside drawings on wide screens, one tabbed column on phones. */
  :root {
    --bg: #edf0f2;
    --surface: #ffffff;
    --sunk: #e3e8ec;
    --ink: #1d2733;
    --muted: #5b6877;
    --line: #cdd5dc;
    --steel: #4f6478;
    --accent: #e3a400;
    --accent-ink: #1d2733;
    --deck: #c79c1a;
    --rail: #4f6478;
    --brace: #2c6a99;
    --tie: #8a3b8f;
    --ok: #2b7a4b;
    --warn: #a86400;
    --bad: #b3261e;
    --canvas: #e6ebef;
    --wall3d: #b5c0ca;
    --display:
      "Barlow Condensed", "Arial Narrow", "Roboto Condensed", sans-serif;
    --body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
    --mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
    --r: 6px;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #10161b;
      --surface: #172028;
      --sunk: #0c1115;
      --ink: #e4e9ee;
      --muted: #94a2af;
      --line: #2a3640;
      --steel: #9db2c5;
      --accent: #f2b705;
      --accent-ink: #10161b;
      --deck: #d8b33f;
      --rail: #9db2c5;
      --brace: #6ea7d4;
      --tie: #c681ca;
      --ok: #5cc28a;
      --warn: #f0a63a;
      --bad: #f2776d;
      --canvas: #141b21;
      --wall3d: #3b4954;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #10161b;
    --surface: #172028;
    --sunk: #0c1115;
    --ink: #e4e9ee;
    --muted: #94a2af;
    --line: #2a3640;
    --steel: #9db2c5;
    --accent: #f2b705;
    --accent-ink: #10161b;
    --deck: #d8b33f;
    --rail: #9db2c5;
    --brace: #6ea7d4;
    --tie: #c681ca;
    --ok: #5cc28a;
    --warn: #f0a63a;
    --bad: #f2776d;
    --canvas: #141b21;
    --wall3d: #3b4954;
    color-scheme: dark;
  }
  * {
    box-sizing: border-box;
  }
  html,
  body {
    background: var(--bg);
    color: var(--ink);
  }
  body {
    font-family: var(--body);
    font-size: 15px;
    line-height: 1.45;
  }
  .wrap {
    padding-inline: 16px;
    padding-block: 0 48px;
    max-width: 1400px;
    margin: 0 auto;
  }
  h1,
  h2,
  h3 {
    font-family: var(--display);
    font-weight: 700;
    letter-spacing: 0.01em;
    text-wrap: balance;
    margin: 0;
  }
  h2 {
    font-size: 1.35rem;
    text-transform: uppercase;
  }
  h3 {
    font-size: 1.1rem;
    text-transform: uppercase;
    color: var(--muted);
  }
  .num,
  td.n,
  .mono {
    font-family: var(--mono);
    font-variant-numeric: tabular-nums;
  }

  .strip {
    position: sticky;
    top: env(safe-area-inset-top, 0px);
    z-index: 5;
    background: var(--bg);
    border-bottom: 1px solid var(--line);
    padding-block: 12px 0;
    display: grid;
    gap: 10px;
  }
  .titlebar {
    display: flex;
    flex-wrap: wrap;
    align-items: baseline;
    gap: 6px 14px;
  }
  .titlebar h1 {
    font-size: 1.6rem;
    text-transform: uppercase;
  }
  .titlebar h1 span {
    color: var(--muted);
    font-weight: 600;
  }
  .jobname {
    font-weight: 600;
    min-width: 0;
    overflow-wrap: anywhere;
  }
  .chip {
    font-family: var(--mono);
    font-size: 0.72rem;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    padding: 2px 8px;
    border-radius: 99px;
    border: 1px solid var(--line);
    color: var(--muted);
    white-space: nowrap;
  }
  .chip.sys {
    background: var(--accent);
    color: var(--accent-ink);
    border-color: var(--accent);
  }
  .chip.ok {
    color: var(--ok);
    border-color: currentColor;
  }
  .chip.over {
    color: var(--bad);
    border-color: currentColor;
  }
  .chip.unchecked {
    color: var(--warn);
    border-color: currentColor;
  }
  .totals {
    display: flex;
    flex-wrap: wrap;
    gap: 4px 22px;
    font-size: 0.85rem;
    color: var(--muted);
  }
  .totals b {
    font-family: var(--mono);
    color: var(--ink);
    font-weight: 500;
    font-size: 1rem;
  }

  .tabs {
    display: flex;
    gap: 2px;
    overflow-x: auto;
    scrollbar-width: none;
    margin-inline: -16px;
    padding-inline: 16px;
  }
  .tabs button {
    font-family: var(--display);
    font-size: 1.05rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    background: none;
    border: 0;
    border-bottom: 3px solid transparent;
    color: var(--muted);
    padding: 6px 12px 7px;
    cursor: pointer;
    white-space: nowrap;
  }
  .tabs button[aria-selected="true"] {
    color: var(--ink);
    border-bottom-color: var(--accent);
  }
  .tabs button:focus-visible,
  button:focus-visible,
  input:focus-visible,
  select:focus-visible {
    outline: 2px solid var(--brace);
    outline-offset: 2px;
  }

  .layout {
    display: grid;
    gap: 20px;
    padding-block: 18px;
  }
  .pane {
    min-width: 0;
    display: grid;
    gap: 16px;
    align-content: start;
  }
  @media (min-width: 980px) {
    .layout {
      grid-template-columns: minmax(330px, 400px) minmax(0, 1fr);
    }
    .tabs [data-tab="edit"] {
      display: none;
    }
    #pane-edit[hidden] {
      display: grid !important;
    }
  }

  .panel {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--r);
    padding: 16px;
    display: grid;
    gap: 14px;
    min-width: 0;
  }
  .panel-head {
    display: flex;
    flex-wrap: wrap;
    justify-content: space-between;
    align-items: center;
    gap: 8px;
  }
  .grid2 {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 10px 12px;
  }
  .grid3 {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 10px 12px;
  }
  .span2 {
    grid-column: span 2;
  }
  .span-all {
    grid-column: 1 / -1;
  }
  label.f {
    display: grid;
    gap: 3px;
    font-size: 0.78rem;
    color: var(--muted);
    letter-spacing: 0.02em;
    min-width: 0;
  }
  label.f .hint {
    font-size: 0.72rem;
  }
  input,
  select {
    font: inherit;
    font-size: 0.95rem;
    color: var(--ink);
    background: var(--sunk);
    border: 1px solid var(--line);
    border-radius: 4px;
    padding: 7px 8px;
    width: 100%;
    min-width: 0;
  }
  input[type="number"] {
    font-family: var(--mono);
  }
  label.check {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 0.88rem;
  }
  label.check input {
    width: auto;
  }

  button.btn {
    font: inherit;
    font-weight: 600;
    font-size: 0.88rem;
    cursor: pointer;
    border-radius: 4px;
    padding: 7px 12px;
    border: 1px solid var(--line);
    background: var(--surface);
    color: var(--ink);
  }
  button.btn.primary {
    background: var(--accent);
    border-color: var(--accent);
    color: var(--accent-ink);
  }
  button.btn.danger {
    color: var(--bad);
  }
  button.btn.small {
    padding: 4px 8px;
    font-size: 0.8rem;
  }
  .row {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    align-items: center;
  }

  .run {
    border: 1px solid var(--line);
    border-radius: var(--r);
    padding: 12px;
    display: grid;
    gap: 10px;
    background: var(--bg);
  }
  .run-head {
    display: flex;
    gap: 8px;
    align-items: center;
  }
  .run-head input {
    font-weight: 600;
  }
  .run-meta {
    font-family: var(--mono);
    font-size: 0.75rem;
    color: var(--muted);
  }

  .drawing {
    background: var(--canvas);
    border-radius: 4px;
    overflow-x: auto;
  }
  .drawing svg {
    display: block;
    width: 100%;
    height: auto;
    max-height: 70vh;
  }
  .drawing.elev svg {
    max-height: 50vh;
  }
  #view3d {
    height: min(70vh, 640px);
    min-height: 320px;
    border-radius: 4px;
    overflow: hidden;
    background: var(--canvas);
  }
  #view3d canvas {
    display: block;
    width: 100%;
    height: 100%;
  }
  .legend {
    display: flex;
    flex-wrap: wrap;
    gap: 4px 16px;
    font-size: 0.78rem;
    color: var(--muted);
  }
  .legend i {
    display: inline-block;
    width: 14px;
    height: 4px;
    border-radius: 2px;
    vertical-align: middle;
    margin-right: 6px;
  }

  .tablewrap {
    overflow-x: auto;
  }
  table {
    border-collapse: collapse;
    width: 100%;
    font-size: 0.88rem;
  }
  th {
    text-align: left;
    font-weight: 600;
    color: var(--muted);
    font-size: 0.75rem;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    border-bottom: 1px solid var(--line);
    padding: 6px 8px;
    white-space: nowrap;
  }
  td {
    border-bottom: 1px solid var(--line);
    padding: 6px 8px;
    vertical-align: top;
  }
  td.n,
  th.n {
    text-align: right;
  }
  tr.total td {
    font-weight: 600;
    border-bottom: 0;
  }
  td input {
    padding: 4px 6px;
    font-size: 0.85rem;
    max-width: 7rem;
  }

  .note {
    font-size: 0.82rem;
    color: var(--muted);
    max-width: 70ch;
  }
  .note.warn {
    color: var(--warn);
  }
  .status-ok {
    color: var(--ok);
    font-weight: 600;
  }
  .status-over {
    color: var(--bad);
    font-weight: 600;
  }
  .status-unchecked {
    color: var(--warn);
    font-weight: 600;
  }
  .joblist {
    display: grid;
    gap: 8px;
  }
  .jobitem {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    justify-content: space-between;
    align-items: center;
    padding: 10px 12px;
    border: 1px solid var(--line);
    border-radius: var(--r);
    background: var(--bg);
  }
  .jobitem .meta {
    font-size: 0.78rem;
    color: var(--muted);
    font-family: var(--mono);
  }
  .toast {
    position: fixed;
    left: 50%;
    bottom: calc(16px + env(safe-area-inset-bottom, 0px));
    transform: translateX(-50%);
    background: var(--ink);
    color: var(--bg);
    padding: 8px 14px;
    border-radius: 4px;
    font-size: 0.85rem;
    z-index: 10;
  }
  @media (max-width: 460px) {
    .grid3 {
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }
  }
  @media (prefers-reduced-motion: reduce) {
    * {
      scroll-behavior: auto !important;
    }
  }
</style>

<div class="wrap">
  <header class="strip">
    <div class="titlebar">
      <h1>Scaffold <span>Planner</span></h1>
      <span class="jobname" id="strip-job"
        >Example: two-storey house 12 x 9 m</span
      >
      <span class="chip sys" id="strip-system">Scafom Cuplok</span>
      <span class="chip" id="strip-example">Example data</span>
      <span class="chip" id="strip-save">Not saved</span>
    </div>
    <div class="totals" id="strip-totals" aria-live="polite"></div>
    <nav class="tabs" role="tablist" aria-label="Sections">
      <button role="tab" data-tab="edit" aria-selected="false">Edit</button>
      <button role="tab" data-tab="plan" aria-selected="true">Plan</button>
      <button role="tab" data-tab="3d" aria-selected="false">3D</button>
      <button role="tab" data-tab="parts" aria-selected="false">Parts</button>
      <button role="tab" data-tab="quote" aria-selected="false">Quote</button>
      <button role="tab" data-tab="loads" aria-selected="false">Loads</button>
      <button role="tab" data-tab="rates" aria-selected="false">Rates</button>
      <button role="tab" data-tab="jobs" aria-selected="false">Jobs</button>
    </nav>
  </header>

  <main class="layout">
    <section class="pane" id="pane-edit" hidden></section>
    <section class="pane" id="pane-view"></section>
  </main>
</div>
<div class="toast" id="toast" hidden></div>

<script type="module" src="src/app.js"></script>

<title>Scaffold Planner</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link
  rel="stylesheet"
  href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap"
/>
<style>
  /* Layout: site clipboard. Sticky job strip, editor column beside drawings on wide screens, one tabbed column on phones. */
  :root {
    --bg: #edf0f2;
    --surface: #ffffff;
    --sunk: #e3e8ec;
    --ink: #1d2733;
    --muted: #5b6877;
    --line: #cdd5dc;
    --steel: #4f6478;
    --accent: #e3a400;
    --accent-ink: #1d2733;
    --deck: #c79c1a;
    --rail: #4f6478;
    --brace: #2c6a99;
    --tie: #8a3b8f;
    --ok: #2b7a4b;
    --warn: #a86400;
    --bad: #b3261e;
    --canvas: #e6ebef;
    --wall3d: #b5c0ca;
    --timber: #a0703a;
    --alu: #b8c2cc;
    --bay-1: #2a78d6;
    --bay-2: #eb6834;
    --bay-3: #1baf7a;
    --bay-4: #eda100;
    --bay-5: #e87ba4;
    --bay-6: #008300;
    --bay-7: #6250d6;
    --bay-8: #e34948;
    --display:
      "Barlow Condensed", "Arial Narrow", "Roboto Condensed", sans-serif;
    --body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
    --mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
    --r: 6px;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #10161b;
      --surface: #172028;
      --sunk: #0c1115;
      --ink: #e4e9ee;
      --muted: #94a2af;
      --line: #2a3640;
      --steel: #9db2c5;
      --accent: #f2b705;
      --accent-ink: #10161b;
      --deck: #d8b33f;
      --rail: #9db2c5;
      --brace: #6ea7d4;
      --tie: #c681ca;
      --ok: #5cc28a;
      --warn: #f0a63a;
      --bad: #f2776d;
      --canvas: #141b21;
      --wall3d: #3b4954;
      --timber: #c08a4f;
      --alu: #7d8a96;
      --bay-1: #3987e5;
      --bay-2: #d95926;
      --bay-3: #199e70;
      --bay-4: #c98500;
      --bay-5: #d55181;
      --bay-6: #008300;
      --bay-7: #9085e9;
      --bay-8: #e66767;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #10161b;
    --surface: #172028;
    --sunk: #0c1115;
    --ink: #e4e9ee;
    --muted: #94a2af;
    --line: #2a3640;
    --steel: #9db2c5;
    --accent: #f2b705;
    --accent-ink: #10161b;
    --deck: #d8b33f;
    --rail: #9db2c5;
    --brace: #6ea7d4;
    --tie: #c681ca;
    --ok: #5cc28a;
    --warn: #f0a63a;
    --bad: #f2776d;
    --canvas: #141b21;
    --wall3d: #3b4954;
    --timber: #c08a4f;
    --alu: #7d8a96;
    --bay-1: #3987e5;
    --bay-2: #d95926;
    --bay-3: #199e70;
    --bay-4: #c98500;
    --bay-5: #d55181;
    --bay-6: #008300;
    --bay-7: #9085e9;
    --bay-8: #e66767;
    color-scheme: dark;
  }
  * {
    box-sizing: border-box;
  }
  html,
  body {
    background: var(--bg);
    color: var(--ink);
  }
  body {
    font-family: var(--body);
    font-size: 15px;
    line-height: 1.45;
  }
  .wrap {
    padding-inline: 16px;
    padding-block: 0 48px;
    max-width: 1400px;
    margin: 0 auto;
  }
  h1,
  h2,
  h3 {
    font-family: var(--display);
    font-weight: 700;
    letter-spacing: 0.01em;
    text-wrap: balance;
    margin: 0;
  }
  h2 {
    font-size: 1.35rem;
    text-transform: uppercase;
  }
  h3 {
    font-size: 1.1rem;
    text-transform: uppercase;
    color: var(--muted);
  }
  .num,
  td.n,
  .mono {
    font-family: var(--mono);
    font-variant-numeric: tabular-nums;
  }

  .strip {
    padding-block: 12px 10px;
    display: grid;
    gap: 10px;
  }
  .titlebar {
    display: flex;
    flex-wrap: wrap;
    align-items: baseline;
    gap: 6px 14px;
  }
  .strip-pdf {
    margin-left: auto;
    align-self: center;
  }
  .titlebar h1 {
    font-size: 1.6rem;
    text-transform: uppercase;
  }
  .titlebar h1 span {
    color: var(--muted);
    font-weight: 600;
  }
  .jobname {
    font-weight: 600;
    min-width: 0;
    overflow-wrap: anywhere;
  }
  .chip {
    font-family: var(--mono);
    font-size: 0.72rem;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    padding: 2px 8px;
    border-radius: 99px;
    border: 1px solid var(--line);
    color: var(--muted);
    white-space: nowrap;
  }
  .chip.sys {
    background: var(--accent);
    color: var(--accent-ink);
    border-color: var(--accent);
  }
  .chip.ok {
    color: var(--ok);
    border-color: currentColor;
  }
  .chip.over {
    color: var(--bad);
    border-color: currentColor;
  }
  .chip.unchecked {
    color: var(--warn);
    border-color: currentColor;
  }
  .totals {
    display: flex;
    flex-wrap: wrap;
    gap: 4px 22px;
    font-size: 0.85rem;
    color: var(--muted);
  }
  .totals b {
    font-family: var(--mono);
    color: var(--ink);
    font-weight: 500;
    font-size: 1rem;
  }

  .tabs {
    position: sticky;
    top: env(safe-area-inset-top, 0px);
    z-index: 5;
    background: var(--bg);
    border-bottom: 1px solid var(--line);
    display: flex;
    gap: 2px;
    overflow-x: auto;
    scrollbar-width: none;
    margin-inline: -16px;
    padding-inline: 16px;
  }
  .tabs button {
    font-family: var(--display);
    font-size: 1.05rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    background: none;
    border: 0;
    border-bottom: 3px solid transparent;
    color: var(--muted);
    padding: 6px 12px 7px;
    cursor: pointer;
    white-space: nowrap;
  }
  .tabs button[aria-selected="true"] {
    color: var(--ink);
    border-bottom-color: var(--accent);
  }
  .tabs button:focus-visible,
  button:focus-visible,
  input:focus-visible,
  select:focus-visible {
    outline: 2px solid var(--brace);
    outline-offset: 2px;
  }

  .layout {
    display: grid;
    gap: 20px;
    padding-block: 18px;
  }
  .pane {
    min-width: 0;
    display: grid;
    gap: 16px;
    align-content: start;
  }
  @media (min-width: 980px) {
    .layout {
      grid-template-columns: minmax(330px, 400px) minmax(0, 1fr);
    }
    .tabs [data-tab="edit"] {
      display: none;
    }
    #pane-edit[hidden] {
      display: grid !important;
    }
  }

  .panel {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--r);
    padding: 16px;
    display: grid;
    gap: 14px;
    min-width: 0;
  }
  .panel-head {
    display: flex;
    flex-wrap: wrap;
    justify-content: space-between;
    align-items: center;
    gap: 8px;
  }
  .grid2 {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 10px 12px;
  }
  .grid3 {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 10px 12px;
  }
  .span2 {
    grid-column: span 2;
  }
  .span-all {
    grid-column: 1 / -1;
  }
  label.f {
    display: grid;
    gap: 3px;
    font-size: 0.78rem;
    color: var(--muted);
    letter-spacing: 0.02em;
    min-width: 0;
  }
  label.f .hint {
    font-size: 0.72rem;
  }
  input,
  select {
    font: inherit;
    font-size: 0.95rem;
    color: var(--ink);
    background: var(--sunk);
    border: 1px solid var(--line);
    border-radius: 4px;
    padding: 9px 10px;
    min-height: 44px;
    width: 100%;
    min-width: 0;
  }
  input[type="number"] {
    font-family: var(--mono);
  }
  label.check {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 0.88rem;
  }
  label.check input {
    width: auto;
  }

  button.btn {
    font: inherit;
    font-weight: 600;
    font-size: 0.88rem;
    cursor: pointer;
    border-radius: 4px;
    padding: 7px 12px;
    border: 1px solid var(--line);
    background: var(--surface);
    color: var(--ink);
  }
  button.btn.primary {
    background: var(--accent);
    border-color: var(--accent);
    color: var(--accent-ink);
  }
  button.btn.danger {
    color: var(--bad);
  }
  button.btn.small {
    padding: 6px 12px;
    min-height: 36px;
    font-size: 0.85rem;
  }
  button:disabled {
    opacity: 0.4;
    cursor: default;
  }
  .seg {
    display: flex;
    border: 1px solid var(--line);
    border-radius: 6px;
    overflow: hidden;
    background: var(--sunk);
  }
  .seg-btn {
    flex: 1 1 0;
    min-width: 0;
    min-height: 44px;
    font: inherit;
    font-weight: 600;
    font-size: 0.9rem;
    color: var(--muted);
    background: none;
    border: 0;
    border-left: 1px solid var(--line);
    cursor: pointer;
    padding: 6px 8px;
  }
  .seg-btn:first-child {
    border-left: 0;
  }
  .seg-btn[aria-pressed="true"] {
    background: var(--accent);
    color: var(--accent-ink);
  }
  .shapes {
    display: grid;
    grid-template-columns: repeat(6, minmax(0, 1fr));
    gap: 6px;
  }
  .shape-btn {
    display: grid;
    justify-items: center;
    gap: 2px;
    font: inherit;
    font-size: 0.75rem;
    font-weight: 600;
    line-height: 1.15;
    color: var(--muted);
    background: var(--sunk);
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 8px 4px;
    cursor: pointer;
    min-width: 0;
  }
  .shape-btn svg {
    width: 100%;
    max-width: 52px;
    height: auto;
  }
  .shape-btn[aria-pressed="true"] {
    border-color: var(--accent);
    color: var(--ink);
    box-shadow: inset 0 0 0 1px var(--accent);
  }
  .ico-bldg {
    fill: var(--line);
  }
  .ico-scaf {
    fill: none;
    stroke: var(--accent);
    stroke-width: 3.5;
    stroke-linecap: round;
    stroke-linejoin: round;
  }
  .stepper {
    display: grid;
    grid-template-columns: 44px minmax(0, 1fr) 44px;
  }
  .stepper input {
    border-radius: 0;
    text-align: center;
    font-size: 1.05rem;
    -moz-appearance: textfield;
  }
  .stepper input::-webkit-inner-spin-button,
  .stepper input::-webkit-outer-spin-button {
    -webkit-appearance: none;
    margin: 0;
  }
  .step {
    font: inherit;
    font-size: 1.3rem;
    line-height: 1;
    color: var(--ink);
    background: var(--surface);
    border: 1px solid var(--line);
    cursor: pointer;
  }
  .step:first-child {
    border-radius: 4px 0 0 4px;
    border-right: 0;
  }
  .step:last-child {
    border-radius: 0 4px 4px 0;
    border-left: 0;
  }
  .sides {
    list-style: none;
    margin: 0;
    padding: 0;
    display: grid;
    gap: 4px;
    font-size: 0.85rem;
  }
  .sides li {
    display: grid;
    grid-template-columns: minmax(5.5rem, 1fr) repeat(3, auto);
    gap: 4px 12px;
    padding: 6px 0;
    border-top: 1px solid var(--line);
    color: var(--muted);
    font-family: var(--mono);
    font-size: 0.78rem;
    align-items: baseline;
  }
  .sides li b {
    font-family: var(--body);
    font-size: 0.88rem;
    color: var(--ink);
    font-weight: 600;
  }
  @media (max-width: 460px) {
    .shapes {
      grid-template-columns: repeat(3, minmax(0, 1fr));
    }
    .sides li {
      grid-template-columns: 1fr 1fr;
    }
    .sides li b {
      grid-column: 1 / -1;
    }
  }
  .linkish {
    font: inherit;
    font-size: 0.88rem;
    background: none;
    border: 0;
    padding: 4px 0;
    color: var(--brace);
    text-decoration: underline;
    text-underline-offset: 3px;
    cursor: pointer;
    justify-self: start;
    text-align: left;
  }
  .confirm {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    align-items: center;
    padding: 10px;
    border: 1px solid var(--warn);
    border-radius: 6px;
    font-size: 0.88rem;
  }
  details.more > summary {
    list-style: none;
    cursor: pointer;
    display: grid;
    gap: 2px;
  }
  details.more > summary::-webkit-details-marker {
    display: none;
  }
  details.more > summary h2::after {
    content: " +";
    color: var(--muted);
  }
  details.more[open] > summary h2::after {
    content: " −";
  }
  .drawing.mini svg {
    max-height: 260px;
  }
  @media (min-width: 980px) {
    .drawing.mini {
      display: none;
    }
  }
  .checks ul {
    margin: 0;
    padding-left: 18px;
    display: grid;
    gap: 4px;
    font-size: 0.88rem;
    color: var(--warn);
  }
  .importer {
    position: fixed;
    inset: 0;
    z-index: 20;
    background: var(--bg);
    display: flex;
    flex-direction: column;
    padding: calc(12px + env(safe-area-inset-top, 0px)) 16px
      calc(12px + env(safe-area-inset-bottom, 0px));
    gap: 10px;
  }
  .imp-head {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 8px;
  }
  .imp-body {
    flex: 1;
    min-height: 0;
    display: flex;
    flex-direction: column;
    gap: 8px;
    overflow: auto;
  }
  .imp-drop {
    display: grid;
    gap: 8px;
    place-items: center;
    text-align: center;
    padding: 40px 16px;
    border: 2px dashed var(--line);
    border-radius: 8px;
    background: var(--surface);
    cursor: pointer;
  }
  .imp-drop input {
    max-width: 260px;
  }
  .imp-pages {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
    gap: 10px;
  }
  .imp-page {
    display: grid;
    gap: 6px;
    padding: 6px;
    font: inherit;
    font-size: 0.78rem;
    text-align: left;
    color: var(--ink);
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 6px;
    cursor: pointer;
  }
  .imp-page canvas {
    width: 100%;
    height: auto;
    background: #fff;
  }
  .imp-page[aria-pressed="true"] {
    border-color: var(--accent);
    box-shadow: inset 0 0 0 1px var(--accent);
  }
  .imp-tools {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    align-items: center;
  }
  .imp-scale {
    font-family: var(--mono);
    font-size: 0.8rem;
  }
  .imp-stage {
    flex: 1;
    min-height: 260px;
    border: 1px solid var(--line);
    border-radius: 6px;
    overflow: hidden;
    background: #fff;
  }
  .imp-stage canvas {
    display: block;
    touch-action: none;
  }
  .imp-calib {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    align-items: end;
  }
  .tools {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
  }
  .tool {
    font: inherit;
    font-size: 0.85rem;
    font-weight: 600;
    min-height: 40px;
    padding: 6px 12px;
    border-radius: 99px;
    border: 1px solid var(--line);
    background: var(--sunk);
    color: var(--ink);
    cursor: grab;
    touch-action: none;
  }
  .tool[aria-pressed="true"] {
    background: var(--accent);
    border-color: var(--accent);
    color: var(--accent-ink);
  }
  .drag-ghost {
    position: fixed;
    left: 0;
    top: 0;
    z-index: 30;
    pointer-events: none;
    padding: 6px 10px;
    border-radius: 99px;
    background: var(--accent);
    color: var(--accent-ink);
    font-weight: 600;
    font-size: 0.85rem;
  }
  [data-bay] {
    cursor: pointer;
  }
  .quote-total {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 12px;
    padding: 12px 14px;
    border-radius: 6px;
    background: var(--sunk);
  }
  .quote-total b {
    font-family: var(--mono);
    font-size: 1.5rem;
    font-weight: 500;
  }
  td.big {
    font-family: var(--mono);
    font-size: 1.1rem;
    width: 4.5rem;
  }
  .sub {
    font-size: 0.75rem;
    color: var(--muted);
  }
  .row {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    align-items: center;
  }

  .run {
    border: 1px solid var(--line);
    border-radius: var(--r);
    padding: 12px;
    display: grid;
    gap: 10px;
    background: var(--bg);
  }
  .run-head {
    display: flex;
    gap: 8px;
    align-items: center;
  }
  .run-head input {
    font-weight: 600;
  }
  .run-meta {
    font-family: var(--mono);
    font-size: 0.75rem;
    color: var(--muted);
  }

  .drawing {
    background: var(--canvas);
    border-radius: 4px;
    overflow-x: auto;
  }
  .drawing svg {
    display: block;
    width: 100%;
    height: auto;
    max-height: 70vh;
  }
  .drawing.elev svg {
    max-height: 50vh;
  }
  #view3d {
    height: min(70vh, 640px);
    min-height: 320px;
    border-radius: 4px;
    overflow: hidden;
    background: var(--canvas);
  }
  #view3d canvas {
    display: block;
    width: 100%;
    height: 100%;
  }
  .legend {
    display: flex;
    flex-wrap: wrap;
    gap: 4px 16px;
    font-size: 0.78rem;
    color: var(--muted);
  }
  .legend i {
    display: inline-block;
    width: 14px;
    height: 4px;
    border-radius: 2px;
    vertical-align: middle;
    margin-right: 6px;
  }

  .tablewrap {
    overflow-x: auto;
  }
  table {
    border-collapse: collapse;
    width: 100%;
    font-size: 0.88rem;
  }
  th {
    text-align: left;
    font-weight: 600;
    color: var(--muted);
    font-size: 0.75rem;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    border-bottom: 1px solid var(--line);
    padding: 6px 8px;
    white-space: nowrap;
  }
  td {
    border-bottom: 1px solid var(--line);
    padding: 6px 8px;
    vertical-align: top;
  }
  td.n,
  th.n {
    text-align: right;
  }
  tr.total td {
    font-weight: 600;
    border-bottom: 0;
  }
  td input {
    padding: 4px 6px;
    font-size: 0.85rem;
    max-width: 7rem;
  }

  .note {
    font-size: 0.82rem;
    color: var(--muted);
    max-width: 70ch;
  }
  .note.warn {
    color: var(--warn);
  }
  .status-ok {
    color: var(--ok);
    font-weight: 600;
  }
  .status-over {
    color: var(--bad);
    font-weight: 600;
  }
  .status-unchecked {
    color: var(--warn);
    font-weight: 600;
  }
  .joblist {
    display: grid;
    gap: 8px;
  }
  .jobitem {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    justify-content: space-between;
    align-items: center;
    padding: 10px 12px;
    border: 1px solid var(--line);
    border-radius: var(--r);
    background: var(--bg);
  }
  .jobitem .meta {
    font-size: 0.78rem;
    color: var(--muted);
    font-family: var(--mono);
  }
  .toast {
    position: fixed;
    left: 50%;
    bottom: calc(16px + env(safe-area-inset-bottom, 0px));
    transform: translateX(-50%);
    background: var(--ink);
    color: var(--bg);
    padding: 8px 14px;
    border-radius: 4px;
    font-size: 0.85rem;
    z-index: 10;
  }
  @media (max-width: 460px) {
    .grid3 {
